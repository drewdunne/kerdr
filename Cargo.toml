[package]
name = "kerdr"
version = "0.1.0"
edition = "2024"
description = "An opinionated kanban cockpit for driving herdr sessions"
license = "MIT"
repository = "https://github.com/drewdunne/kerdr"
homepage = "https://github.com/drewdunne/kerdr"
readme = "README.md"
keywords = ["herdr", "kanban", "tui", "agents", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/screenshots/*"]

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[dev-dependencies]
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
tempfile = "3.27.0"
