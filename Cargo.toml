[package]
name = "kerdr"
version = "0.13.1"
edition = "2024"
description = "An opinionated kanban cockpit for driving herdr sessions"
license = "MIT"
repository = "https://github.com/drewdunne/kerdr"
homepage = "https://github.com/drewdunne/kerdr"
readme = "README.md"
keywords = ["herdr", "kanban", "tui", "agents", "terminal"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["docs/screenshots/*"]

[dependencies]
base64 = "0.22"
hostname = "0.4"
anyhow = "1.0.104"
tempfile = "3.27.0"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
libc = "0.2.191"
ratatui = "0.30.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
toml_edit = "0.25.17"
unicode-width = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_Security", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp"] }

[dev-dependencies]
fontdue = "0.9.5"
image = { version = "0.25.10", default-features = false, features = ["png"] }
