name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-14
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --locked --target ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package Unix
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf kerdr-${{ matrix.target }}.tar.gz kerdr
          shasum -a 256 kerdr-${{ matrix.target }}.tar.gz > kerdr-${{ matrix.target }}.tar.gz.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-Location target/${{ matrix.target }}/release
          Compress-Archive -Path kerdr.exe -DestinationPath kerdr-${{ matrix.target }}.zip
          $hash = (Get-FileHash kerdr-${{ matrix.target }}.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  kerdr-${{ matrix.target }}.zip" | Set-Content kerdr-${{ matrix.target }}.zip.sha256 -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: kerdr-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/kerdr-${{ matrix.target }}.tar.gz*
            target/${{ matrix.target }}/release/kerdr-${{ matrix.target }}.zip*

  publish:
    needs: [build, validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: kerdr-*
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
