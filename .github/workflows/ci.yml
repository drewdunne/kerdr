name: ci

on:
  push:
    branches: [main, 'feat/native-windows-*']
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --examples
      - run: cargo build --locked
      - name: Install herdr's latest Unix release
        if: runner.os != 'Windows'
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Kerdr against a real Unix herdr server
        if: runner.os != 'Windows'
        run: tests/live-herdr.sh target/debug/kerdr
      - name: Install herdr's latest Windows release
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Invoke-RestMethod https://herdr.dev/install.ps1 | Invoke-Expression
          "$env:LOCALAPPDATA\Programs\Herdr\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - name: Install Windows console test driver
        if: runner.os == 'Windows'
        run: python -m pip install pywinpty==3.0.2
      - name: Kerdr against a real Windows herdr server and ConPTY
        if: runner.os == 'Windows'
        run: python tests/windows_live.py target/debug/kerdr.exe
      - uses: actions/upload-artifact@v4
        if: always() && runner.os == 'Windows'
        with:
          name: windows-console-evidence
          path: test-results/

  # The new-intent box reads images from the real clipboard on every platform Kerdr ships.
  clipboard:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked --lib --no-run
      - name: Install X11 and Wayland clipboard tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y xvfb xclip sway wl-clipboard
      - name: Images from a real clipboard
        if: runner.os != 'Windows'
        run: tests/live-clipboard.sh docs/screenshots/new-intent.png
      - name: Images from a real Windows clipboard
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          $image = (Resolve-Path docs/screenshots/new-intent.png).Path
          [System.Windows.Forms.Clipboard]::SetImage([System.Drawing.Image]::FromFile($image))
          $env:KERDR_LIVE_CLIPBOARD_IMAGE = $image
          cargo test --locked --lib -- --ignored --exact images::tests::live_clipboard
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
